<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07172a">
<title>راه‌های ارتباطی | جام‌کاران جهان‌دیده</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#07172a;--ink:#1F2C43;--teal:#8BAAAD;--glass:rgba(255,255,255,.09)}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--navy);color:#fff;min-height:100vh;min-height:100svh;overflow-x:hidden;display:flex;justify-content:center}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* ---------- پس‌زمینه: عکس نما، شیشه‌ی شیاردار و نورهای شناور ---------- */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.bg .photo{position:absolute;inset:-6%;background:url(assets/img-71dd236196.jpg) center/cover;filter:blur(6px) saturate(.9);opacity:.32;transform:scale(1.05)}
.bg .tint{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,23,42,.55),rgba(7,23,42,.82) 55%,#07172a)}
.bg .flutes{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,rgba(255,255,255,0) 1px 46px,rgba(255,255,255,.025) 46px 47px,rgba(255,255,255,0) 47px 92px);-webkit-mask-image:linear-gradient(180deg,#000,transparent 85%);mask-image:linear-gradient(180deg,#000,transparent 85%)}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;will-change:transform;animation:drift 18s ease-in-out infinite alternate}
.o1{width:340px;height:340px;background:#2b6f9e;top:-90px;right:-80px}
.o2{width:300px;height:300px;background:#8BAAAD;bottom:8%;left:-110px;animation-duration:23s;opacity:.38}
.o3{width:260px;height:260px;background:#3E4C59;top:42%;right:-90px;animation-duration:27s;opacity:.7}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(var(--dx,30px),var(--dy,40px),0) scale(1.12)}}

/* ---------- صفحه ---------- */
.page{position:relative;z-index:1;width:min(460px,100%);padding:clamp(28px,6vh,56px) 18px 34px;display:flex;flex-direction:column;align-items:center}

.id{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.mark{position:relative;width:104px;height:104px;border-radius:50%;display:grid;place-items:center;background:var(--glass);-webkit-backdrop-filter:blur(25px);backdrop-filter:blur(25px);box-shadow:0 18px 44px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.mark:before{content:"";position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(from 0deg,rgba(139,170,173,0),rgba(139,170,173,.9),rgba(255,255,255,0) 55%,rgba(139,170,173,0));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px));animation:spin 7s linear infinite}
.mark img{width:50px;filter:brightness(0) invert(1);position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
.id h1{font-size:23px;font-weight:900;letter-spacing:-.2px}
.id p{font-size:13.5px;color:var(--teal);font-weight:600}

/* ---------- عملیات سریع ---------- */
.quick{display:flex;gap:10px;margin:22px 0 20px;animation:rise .9s .12s cubic-bezier(.2,.7,.2,1) both}
.q{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid rgba(255,255,255,.28);-webkit-backdrop-filter:blur(25px);backdrop-filter:blur(25px);transition:transform .35s cubic-bezier(.2,.7,.2,1),background .3s;position:relative}
.q svg{width:23px;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.q:hover,.q:focus-visible{transform:translateY(-4px) scale(1.06);background:rgba(255,255,255,.2)}
.q span{position:absolute;bottom:-20px;font-size:11px;color:#c9d3e6;white-space:nowrap}

/* ---------- کارت‌های لینک ---------- */
.links{width:100%;display:flex;flex-direction:column;gap:11px;margin-top:10px}
.group{font-size:12px;color:#9fb0cf;margin:12px 6px 0;letter-spacing:.2px;animation:rise .9s both}
.card{--mx:50%;--my:50%;position:relative;overflow:hidden;display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:14px;padding:13px 14px;border-radius:20px;background:var(--glass);border:1px solid rgba(255,255,255,.24);-webkit-backdrop-filter:blur(25px) saturate(1.3);backdrop-filter:blur(25px) saturate(1.3);box-shadow:0 10px 30px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.22);transition:transform .4s cubic-bezier(.2,.7,.2,1),border-color .3s,background .3s;animation:rise .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i) * 70ms + 220ms)}
.card:before{content:"";position:absolute;inset:0;background:radial-gradient(240px circle at var(--mx) var(--my),rgba(255,255,255,.2),transparent 60%);opacity:0;transition:opacity .3s}
.card:after{content:"";position:absolute;top:0;bottom:0;width:36%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-18deg)}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.13)}
.card:hover:before{opacity:1}
.card:hover:after{left:130%;transition:left .9s cubic-bezier(.2,.7,.2,1)}
.card:active{transform:scale(.985)}
.ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);transition:background .35s,transform .35s,border-color .35s;position:relative;z-index:1}
.ic svg{width:25px;fill:#fff}
.ic svg.ln{fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic b{font-size:13px;font-weight:700}
.ic img{width:34px;height:auto}
.card:hover .ic{background:var(--c,rgba(255,255,255,.2));border-color:transparent;transform:rotate(-6deg) scale(1.06)}
.tx{position:relative;z-index:1;min-width:0}
.tx strong{display:block;font-size:15.5px;font-weight:600}
.tx small{display:block;margin-top:2px;font-size:12.5px;color:#b9c6dd;direction:rtl}
.ar{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);transition:transform .35s,background .3s}
.ar svg{width:14px;fill:none;stroke:#fff;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.card:hover .ar{transform:translateX(-4px);background:rgba(255,255,255,.22)}
.card.pending{opacity:.62;cursor:default;pointer-events:none}
.card.pending .ar{display:none}
.soon{position:relative;z-index:1;font-size:11px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.12);color:#c9d3e6;white-space:nowrap}

/* ---------- آدرس و پایان ---------- */
.addr{margin-top:26px;text-align:center;font-size:12.5px;line-height:2;color:#9fb0cf;animation:rise .9s .9s both}
.addr b{color:#dbe3f1;font-weight:600}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);background:rgba(255,255,255,.95);color:var(--ink);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.4s;z-index:5}
.toast.on{opacity:1;transform:translate(-50%,0)}
@keyframes rise{from{opacity:0;transform:translateY(22px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="photo"></div><div class="tint"></div><div class="flutes"></div><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i></div>

<main class="page">
  <header class="id">
    <div class="mark"><img src="assets/img-76fe925819.png" alt="لوگوی جام‌کاران جهان‌دیده"></div>
    <h1>جام‌کاران جهان‌دیده</h1>
    <p>صنایع تولید شیشه سکوریت و آینه</p>
  </header>

  <nav class="quick" aria-label="دسترسی سریع">
    <a class="q" href="tel:+982155258738" aria-label="تماس"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg><span>تماس</span></a>
    <a class="q" id="mapQuick" href="https://maps.app.goo.gl/X47LVhaXhbwTCxJL6?g_st=ic" target="_blank" rel="noopener" aria-label="مسیریابی"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.800 12 21 12 21z"/><circle cx="12" cy="9.500" r="2.500"/></svg><span>مسیریابی</span></a>
    <button class="q" id="vcard" aria-label="ذخیره در مخاطبین"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 19h14"/></svg><span>ذخیره مخاطب</span></button>
    <button class="q" id="share" aria-label="اشتراک‌گذاری"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.500"/><circle cx="18" cy="6" r="2.500"/><circle cx="18" cy="18" r="2.500"/><path d="M8.200 10.800l7.600-3.600M8.200 13.200l7.600 3.600"/></svg><span>اشتراک</span></button>
  </nav>

  <section class="links" id="links"></section>

  <p class="addr"><b>آدرس:</b> اتوبان آیت‌الله سعیدی، چهاردانگه، ورودی جدید شهرک صنعتی، خیابان ناصر، پ ۲۳<br><b>تلفن:</b> <a href="tel:+982155258738" dir="ltr">۰۲۱-۵۵۲۵۸۷۳۸</a></p>
</main>
<div class="toast" id="toast"></div>

<script>
/* لینک پیام‌رسان‌ها را اینجا وارد کنید. تا وقتی خالی باشند، دکمه‌شان با برچسب «به‌زودی» غیرفعال نمایش داده می‌شود. */
const LINKS = { telegram: '', whatsapp: '', bale: '', rubika: '', mirror: '' };

const ICON = {
  tg: '<svg viewBox="0 0 24 24"><path d="M21.500 3.400 2.700 10.600c-1 .4-.9 1.100-.2 1.300l4.800 1.500 1.800 5.600c.2.600.4.800.9.800s.7-.2 1-.5l2.300-2.200 4.700 3.500c.9.500 1.500.2 1.700-.8l3-14.600c.3-1.200-.4-1.700-1.300-1.300zM9 13.500l9.300-5.800c.4-.3.8-.1.5.2l-7.700 7-.3 3.200z"/></svg>',
  wa: '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.600 15.100L2 22l5-1.300A10 10 0 1 0 12 2zm5 13.800c-.2.600-1.200 1.100-1.700 1.200-.5.100-1 .1-3.400-.9-2.900-1.200-4.700-4.200-4.900-4.400-.1-.2-1.100-1.500-1.100-2.800s.7-2 1-2.300c.2-.3.500-.3.700-.3h.5c.2 0 .4 0 .6.500l.8 2c.1.200.1.400 0 .5l-.4.600c-.1.200-.3.300-.1.600.2.300.8 1.300 1.700 2.100 1.200 1 2.100 1.300 2.400 1.500.3.100.5.100.6-.1l.9-1.100c.2-.2.4-.2.600-.1l1.900.9c.2.100.4.200.4.300.1.200.1.800-.1 1.400z"/></svg>',
  web: '<svg class="ln" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.600 2.600 3.800 5.600 3.800 9S14.600 18.400 12 21c-2.600-2.600-3.800-5.600-3.800-9S9.400 5.600 12 3z"/></svg>',
  calc: '<svg class="ln" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2.500"/><path d="M8.500 7.500h7M8.500 12h.01M12 12h.01M15.500 12h.01M8.500 16h.01M12 16h.01M15.500 16h.01"/></svg>',
  call: '<svg class="ln" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.500 1.500a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>',
  pin: '<svg class="ln" viewBox="0 0 24 24"><path d="M12 21s7-6.200 7-11.500A7 7 0 0 0 5 9.500C5 14.800 12 21 12 21z"/><circle cx="12" cy="9.500" r="2.500"/></svg>',
  mir: '<img src="assets/img-2356b59edf.png" alt="">'
};
const ITEMS = [
  { g: 'خود مجموعه' },
  { t: 'وب‌سایت جام‌کاران جهان‌دیده', s: 'محصولات، خدمات و درباره‌ی ما', href: 'index.html', icon: ICON.web, c: '#3E4C59' },
  { t: 'تخمین قیمت شیشه', s: 'محاسبه‌ی تخمینی و ثبت استعلام', href: 'index.html#est', icon: ICON.calc, c: '#2b6f9e' },
  { g: 'تماس و موقعیت' },
  { t: 'تماس تلفنی', s: '۰۲۱-۵۵۲۵۸۷۳۸', href: 'tel:+982155258738', icon: ICON.call, c: '#4a8f7a' },
  { t: 'موقعیت مکانی', s: 'مسیریابی در Google Maps', href: 'https://maps.app.goo.gl/X47LVhaXhbwTCxJL6?g_st=ic', icon: ICON.pin, c: '#c2554d', blank: true },
  { g: 'پیام‌رسان‌ها' },
  { t: 'تلگرام', s: 'گفتگو در تلگرام', href: LINKS.telegram, icon: ICON.tg, c: '#2AABEE', blank: true },
  { t: 'واتساپ', s: 'گفتگو در واتساپ', href: LINKS.whatsapp, icon: ICON.wa, c: '#25D366', blank: true },
  { t: 'بله', s: 'گفتگو در بله', href: LINKS.bale, icon: '<b>بله</b>', c: '#1BA39C', blank: true },
  { t: 'روبیکا', s: 'گفتگو در روبیکا', href: LINKS.rubika, icon: '<b>روبیکا</b>', c: '#8A3FF0', blank: true },
  { g: 'مجموعه‌های همکار' },
  { t: 'آینه‌فروشی', s: 'فروشگاه آنلاین آینه', href: LINKS.mirror, icon: ICON.mir, c: '#d9e2f2', blank: true }
];
const root = document.getElementById('links');
let n = 0;
ITEMS.forEach(it => {
  if (it.g) { const g = document.createElement('div'); g.className = 'group'; g.style.animationDelay = (n * 70 + 200) + 'ms'; g.textContent = it.g; root.append(g); return; }
  const ok = !!it.href;
  const a = document.createElement(ok ? 'a' : 'div');
  a.className = 'card' + (ok ? '' : ' pending');
  a.style.setProperty('--i', n++);
  a.style.setProperty('--c', it.c);
  if (ok) { a.href = it.href; if (it.blank) { a.target = '_blank'; a.rel = 'noopener'; } }
  a.innerHTML = '<span class="ic">' + it.icon + '</span><span class="tx"><strong>' + it.t + '</strong><small>' + it.s + '</small></span>' +
    (ok ? '<span class="ar"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></span>' : '<span class="soon">به‌زودی</span>');
  a.addEventListener('pointermove', e => { const r = a.getBoundingClientRect(); a.style.setProperty('--mx', (e.clientX - r.left) + 'px'); a.style.setProperty('--my', (e.clientY - r.top) + 'px'); });
  root.append(a);
});

const toast = (m) => { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2200); };

document.getElementById('share').addEventListener('click', async () => {
  const data = { title: 'جام‌کاران جهان‌دیده', text: 'صنایع تولید شیشه سکوریت و آینه', url: location.href };
  try { if (navigator.share) await navigator.share(data); else { await navigator.clipboard.writeText(location.href); toast('لینک کپی شد'); } }
  catch (e) { /* کاربر انصراف داد */ }
});

document.getElementById('vcard').addEventListener('click', () => {
  const v = ['BEGIN:VCARD', 'VERSION:3.0', 'FN:جام‌کاران جهان‌دیده', 'ORG:جام‌کاران جهان‌دیده', 'TITLE:صنایع تولید شیشه سکوریت و آینه',
    'TEL;TYPE=WORK,VOICE:+982155258738', 'ADR;TYPE=WORK:;;اتوبان آیت‌الله سعیدی، چهاردانگه، ورودی جدید شهرک صنعتی، خیابان ناصر، پ ۲۳;;;;', 'END:VCARD'].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([v], { type: 'text/vcard;charset=utf-8' }));
  a.download = 'jamkaran.vcf';
  document.body.append(a); a.click(); a.remove();
  toast('کارت مخاطب ذخیره شد');
});

/* نورهای پس‌زمینه با حرکت اشاره‌گر کمی جابه‌جا می‌شوند */
addEventListener('pointermove', e => {
  const x = e.clientX / innerWidth - .5, y = e.clientY / innerHeight - .5;
  document.querySelectorAll('.orb').forEach((o, i) => { o.style.setProperty('--dx', (x * (60 + i * 30)) + 'px'); o.style.setProperty('--dy', (y * (60 + i * 30)) + 'px'); });
});
</script>
</body>
</html>
